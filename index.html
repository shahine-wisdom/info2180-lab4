<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avengers Character Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Avengers Character Search</h1>

    <label for="search">Search by Full Name or Alias</label>

    <input
        type="text"
        id="search"
        placeholder="e.g. Captain America or Steve Rogers"
    >

    <button id="searchButton">Search</button>

    <h3>RESULT</h3>

    <div id="result"></div>

    <script src="app.js"></script>

</body>
</html>
